name: Daily ingest

# Runs entirely on GitHub's runners — nothing here requires local execution.
# Adzuna needs ADZUNA_APP_ID / ADZUNA_APP_KEY as GitHub Secrets (Settings ->
# Secrets and variables -> Actions). EURES needs no key at all.

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily — adjust to taste
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false  # let an in-flight ingest finish rather than kill it mid-run

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Adzuna ingest
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python ingest/adzuna_ingest.py

      - name: Run EURES ingest
        run: python ingest/eures_ingest.py

      - name: Commit and push new raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "No new data today — nothing to commit."
            exit 0
          fi
          git commit -m "Daily ingest: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
