  - name: stg_eures__nl
    description: "Netherlands. {{ doc('daily_snapshot_grain') }}"
    columns: *common_columns

  - name: stg_eures__be
    description: "Belgium. {{ doc('daily_snapshot_grain') }}"
    columns: *common_columns

  - name: stg_eures__pl
    description: "Poland. {{ doc('daily_snapshot_grain') }}"
    columns: *common_columns

  - name: stg_eures__pt
    description: "Portugal. {{ doc('daily_snapshot_grain') }}"
